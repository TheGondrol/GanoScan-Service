openapi: 3.1.0
info:
  title: GanoScan Service
  description: Stateless Ganoderma detection inference for the GanoScan Android app.
    Nothing is persisted server-side — the app owns its own scan history.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Service + model status
      description: Always reachable without an API key, for load balancer / uptime
        checks.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /predict:
    post:
      tags:
      - inference
      summary: Classify an uploaded photo
      description: 'Classifies the uploaded image and returns the result. Stateless:
        nothing

        is persisted server-side — the client is responsible for its own history.'
      operationId: predict
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_predict'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          description: Empty or unreadable image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '413':
          description: Image exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Missing/invalid form fields (FastAPI validation)
        '500':
          description: Model inference failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      security:
      - APIKeyHeader: []
components:
  schemas:
    Body_predict:
      properties:
        image:
          type: string
          format: binary
          title: Image
          description: Leaf/stem photo (jpg, jpeg, png, bmp or webp)
      type: object
      required:
      - image
      title: Body_predict
    ErrorDetail:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorDetail
      description: Shape of every error response (FastAPI's default HTTPException
        body).
    Health:
      properties:
        status:
          type: string
          title: Status
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
        model:
          $ref: '#/components/schemas/ModelInfo'
      type: object
      required:
      - status
      - service
      - version
      - model
      title: Health
    ModelInfo:
      properties:
        mode:
          type: string
          title: Mode
        loaded:
          type: boolean
          title: Loaded
        backbone:
          type: string
          title: Backbone
        classes:
          items:
            type: string
          type: array
          title: Classes
        imageSize:
          items:
            type: integer
          type: array
          title: Imagesize
        device:
          type: string
          title: Device
        testAccuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Testaccuracy
        autoencoderLoaded:
          type: boolean
          title: Autoencoderloaded
          default: false
      type: object
      required:
      - mode
      - loaded
      - backbone
      - classes
      - imageSize
      - device
      title: ModelInfo
    ScanResult:
      properties:
        verdict:
          type: string
          title: Verdict
        label:
          type: string
          title: Label
        predictedClass:
          type: string
          title: Predictedclass
        severity:
          type: string
          title: Severity
        confidence:
          type: number
          title: Confidence
        probabilities:
          additionalProperties:
            type: number
          type: object
          title: Probabilities
        gamma:
          type: number
          title: Gamma
        inputResolution:
          type: string
          title: Inputresolution
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
        stages:
          items:
            $ref: '#/components/schemas/Stage'
          type: array
          title: Stages
        mock:
          type: boolean
          title: Mock
      type: object
      required:
      - verdict
      - label
      - predictedClass
      - severity
      - confidence
      - probabilities
      - gamma
      - inputResolution
      - recommendations
      - stages
      - mock
      title: ScanResult
      description: 'The full /predict response. Stateless — no id/timestamp/image-url

        fields, since the service persists nothing; the client owns its own

        history and generates whatever local identifiers it needs.'
    Stage:
      properties:
        index:
          type: string
          title: Index
        title:
          type: string
          title: Title
        sub:
          type: string
          title: Sub
        done:
          type: boolean
          title: Done
          default: false
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
      type: object
      required:
      - index
      - title
      - sub
      title: Stage
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
