services:
  - type: web
    name: ganoscan-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Set this to the SAME value already baked into the Android app
      # (GanoScan/app/.../network/ApiClient.kt) — sync: false means Render
      # will prompt for the value instead of storing it in this file.
      - key: GANOSCAN_API_KEY
        sync: false
